
name: GOLD SCANNER - external and manual запуск

on:
  workflow_dispatch:
    inputs:
      telegram_test:
        description: 'Send Telegram test message'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gold-scanner-scheduled-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run GOLD SCANNER
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ inputs.telegram_test && '1' || '0' }}
          MAX_MONITORED: '1000'
        run: python scanner.py

      - name: Save scanner state and daily cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if [ -f daily_cache.json ]; then
            git add daily_cache.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Update scanner state and daily cache [skip ci]"
            git push
          else
            echo "No state or cache changes to save."
          fi
