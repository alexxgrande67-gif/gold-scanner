name: GOLD SCANNER - external and manual запуск

on:
  workflow_dispatch:
    inputs:
      telegram_test:
        description: 'Send Telegram test message'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gold-scanner-scheduled-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run GOLD SCANNER
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ inputs.telegram_test && '1' || '0' }}
          MAX_MONITORED: '500'
        run: python scanner.py

      - name: Save signal de-duplication state
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update scanner state [skip ci]"
            git push
          fi
